name: CD
on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: []
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: |
          docker build -f sentinel/docker/Dockerfile.backend -t sentinel-backend .
          docker build -f sentinel/docker/Dockerfile.frontend -t sentinel-frontend .

      - name: Deploy to Render
        if: github.ref == 'refs/heads/main'
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          else
            echo "RENDER_DEPLOY_HOOK_URL not set, skipping deploy"
          fi
