name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
        working-directory: sentinel
      - name: Lint
        run: ruff check sentinel/src/ sentinel/ml/ sentinel/workers/ sentinel/tests/
      - name: Type check
        run: mypy sentinel/src/

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: sentinel_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
        working-directory: sentinel
      - name: Run tests
        run: pytest sentinel/tests/ --cov=sentinel/src --cov=sentinel/ml --cov-report=xml
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:test@localhost/sentinel_test
          REDIS_URL: redis://localhost:6379
          SECRET_KEY: test-secret-key-32-chars-minimum!!
          API_KEY: test-api-key
          HF_TOKEN: ""
      - uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
