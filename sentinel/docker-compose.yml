version: "3.9"

services:
  # ── Backend API ─────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8000:8000"
    env_file: .env.example
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/sentinel
      - REDIS_URL=redis://redis:6379
      - PYTHONPATH=/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sentinel

  # ── Frontend (Streamlit) ──────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "8501:8501"
    env_file: .env.example
    environment:
      - API_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - sentinel

  # ── PostgreSQL ──────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sentinel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sentinel

  # ── Redis ───────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sentinel

  # ── Celery Worker ───────────────────────────────────────────────
  celery_worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    command: celery -A sentinel.workers.celery_app worker --loglevel=info
    env_file: .env.example
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/sentinel
      - REDIS_URL=redis://redis:6379
      - PYTHONPATH=/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sentinel

  # ── Celery Beat (Scheduler) ────────────────────────────────────
  celery_beat:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    command: celery -A sentinel.workers.celery_app beat --loglevel=info
    env_file: .env.example
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/sentinel
      - REDIS_URL=redis://redis:6379
      - PYTHONPATH=/app
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - sentinel

  # ── Prometheus ─────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - sentinel

  # ── Grafana ────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=sentinel
    networks:
      - sentinel

volumes:
  postgres_data:

networks:
  sentinel:
    driver: bridge
