[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel"
version = "2.0.0"
description = "Production-grade AI fraud detection platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "redis[hiredis]>=5.0",
    "python-jose[cryptography]>=3.3",
    "slowapi>=0.1.9",
    "xgboost>=2.0",
    "shap>=0.45",
    "mlflow>=2.14",
    "optuna>=3.6",
    "imbalanced-learn>=0.12",
    "huggingface-hub>=0.23",
    "celery[redis]>=5.4",
    "prometheus-client>=0.20",
    "structlog>=24.2",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "fakeredis[aioredis]>=2.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "aiosqlite>=0.20",
]
frontend = [
    "streamlit>=1.36",
    "requests>=2.31",
    "websocket-client>=1.7",
]

[tool.setuptools.packages.find]
where = ["sentinel"]
include = ["src*", "ml*", "workers*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["sentinel/tests"]
addopts = "--strict-markers -q"

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
fail_under = 80
